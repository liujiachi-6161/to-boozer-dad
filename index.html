<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体育助教系统</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>体育助教系统</h1>
        <div class="sync-box">
            <button id="syncBtn">云端同步</button>
            <span id="syncStatus"></span>
        </div>
    </header>

    <!-- 顶部导航 6个标签 -->
    <div class="tab-bar">
        <button class="tab active" data-tab="calendarLog">课堂档案</button>
        <button class="tab" data-tab="aiChat">AI助教</button>
        <button class="tab" data-tab="lessonPlan">教案管理</button>
        <button class="tab" data-tab="activity">课堂活动资源</button>
        <button class="tab" data-tab="roster">学生名册管理</button>
        <button class="tab" data-tab="stats">课时出勤统计</button>
    </div>

    <!-- ========== 页面1：课堂档案（首页） ========== -->
    <div class="panel active" id="calendarLog">
        <div class="row">
            <!-- 左侧：日历 -->
            <div class="col-left">
                <div class="calendar-wrap card">
                    <div class="cal-header">
                        <button id="prevMonth">&lt;</button>
                        <h2 id="calTitle"></h2>
                        <button id="nextMonth">&gt;</button>
                    </div>
                    <div class="cal-week">
                        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
                    </div>
                    <div id="calDays" class="cal-days"></div>
                </div>
            </div>

            <!-- 右侧：当日记录 + 点名 + 手记 -->
            <div class="col-right">
                <!-- 当日基本信息 -->
                <div class="day-info card">
                    <h3>当日记录：<span id="currentDateShow"></span></h3>
                    <div class="form-line">
                        <label>班级：</label>
                        <select id="classNameSelect">
                            <option value="">请选择班级（先在名册管理中创建）</option>
                        </select>
                    </div>
                    <div class="form-line">
                        <label>课时：</label>
                        <input id="lessonNo" type="text" placeholder="第1课时">
                    </div>
                    <div class="form-line">
                        <label>
                            <input type="checkbox" id="cancelledCheck"> 本节课取消（停课）
                        </label>
                    </div>
                </div>

                <!-- 顺序点名区 -->
                <div class="rollcall-block card">
                    <h4>点名签到</h4>
                    <div class="rollcall-seq-area" id="rollcallSeqArea">
                        <div class="seq-placeholder">请先在上方选择班级，然后点击"开始点名"</div>
                    </div>
                    <div class="btn-row">
                        <button id="startRollCallBtn">开始点名</button>
                        <button id="resetRollCallBtn" class="gray">重新点名</button>
                        <button id="saveAttendanceBtn">保存本次出勤</button>
                    </div>

                    <!-- 下方汇总纠错列表 -->
                    <div class="rollcall-review" id="rollcallReview">
                        <div class="review-title">出勤明细（点错可在此修正，仅改状态，不能改名单）</div>
                        <div id="reviewList" class="review-list"></div>
                    </div>
                </div>

                <!-- 随堂手记 -->
                <div class="log-block card">
                    <h4>随堂手记</h4>
                    <textarea id="lessonNote" placeholder="记录课堂情况、问题、心得..."></textarea>
                    <div class="btn-row">
                        <button id="saveNoteBtn">保存手记</button>
                    </div>
                    <div class="saved-ai-log-title">已存档AI教案</div>
                    <div id="savedAiLogBox"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== 页面2：AI助教 ========== -->
    <div class="panel" id="aiChat">
        <div class="ai-top-bar card">
            <label>模型选择：
                <select id="modelSelect">
                    <option value="deepseek">DeepSeek</option>
                    <option value="doubao">豆包</option>
                </select>
            </label>
        </div>
        <div id="chatBox" class="chat-box card"></div>
        <div class="chat-input-area card">
            <textarea id="chatInput" placeholder="描述你的需求：生成体育课教案、构思课堂游戏..."></textarea>
            <div class="chat-btn-row">
                <button id="sendChatBtn">发送提问</button>
                <button id="saveLastAiBtn" class="gray">将最后AI回答保存至当日记录</button>
            </div>
        </div>
    </div>

    <!-- ========== 页面3：教案管理 ========== -->
    <div class="panel" id="lessonPlan">
        <div class="card">
            <h3>编写新教案</h3>
            <div class="form-line">
                <label>教案标题：</label>
                <input id="lpTitle" type="text" placeholder="例如：五年级篮球运球教案">
            </div>
            <div class="form-line">
                <label>适用班级：</label>
                <input id="lpClass" type="text" placeholder="例如：五年级2班">
            </div>
            <div class="form-line">
                <label>教案内容：</label>
                <textarea id="lpContent" placeholder="在此编写完整教案..."></textarea>
            </div>
            <div class="btn-row">
                <button id="lpSaveBtn">保存教案</button>
                <button id="lpClearBtn" class="gray">清空输入</button>
            </div>
        </div>
        <div class="card" style="margin-top:14px;">
            <h3>历史教案</h3>
            <div id="lpList"></div>
        </div>
    </div>

    <!-- ========== 页面4：课堂活动资源 ========== -->
    <div class="panel" id="activity">
        <div class="card">
            <h3>添加活动资源</h3>
            <div class="form-line">
                <label>活动名称：</label>
                <input id="actTitle" type="text" placeholder="例如：抓人游戏">
            </div>
            <div class="form-line">
                <label>活动类型：</label>
                <select id="actCategory">
                    <option value="热身">热身活动</option>
                    <option value="游戏">课堂游戏</option>
                    <option value="练习">趣味练习</option>
                    <option value="放松">放松活动</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-line">
                <label>活动玩法/规则：</label>
                <textarea id="actContent" placeholder="描述活动规则、玩法、注意事项..."></textarea>
            </div>
            <div class="btn-row">
                <button id="actSaveBtn">保存活动</button>
                <button id="actClearBtn" class="gray">清空输入</button>
            </div>
        </div>
        <div class="card" style="margin-top:14px;">
            <div class="activity-header">
                <h3>活动资源库</h3>
                <button id="actRandomBtn" class="random-btn">随机抽取一个活动</button>
            </div>
            <div id="actRandomResult" class="random-result"></div>
            <div id="actList"></div>
        </div>
    </div>

    <!-- ========== 页面5：学生名册管理 ========== -->
    <div class="panel" id="roster">
        <div class="card">
            <h3>新建班级</h3>
            <div class="form-line">
                <label>班级名称：</label>
                <input id="rosterClassName" type="text" placeholder="例如：五年级2班">
            </div>
            <div class="form-line">
                <label>学生名单（每行一名）：</label>
                <textarea id="rosterStudentText" placeholder="张三&#10;李四&#10;王五"></textarea>
            </div>
            <div class="btn-row">
                <button id="rosterAddClassBtn">创建班级</button>
            </div>
        </div>
        <div class="card" style="margin-top:14px;">
            <h3>已有班级名册</h3>
            <div id="rosterClassList"></div>
        </div>
    </div>

    <!-- ========== 页面6：课时出勤统计 ========== -->
    <div class="panel" id="stats">
        <div class="card">
            <div class="stats-header">
                <h3>学期出勤与课时统计</h3>
                <div class="stats-filter">
                    <label>筛选班级：
                        <select id="statsClassFilter">
                            <option value="">全部班级</option>
                        </select>
                    </label>
                </div>
            </div>
            <div id="statsSummary" class="stats-summary"></div>
        </div>
        <div class="card" style="margin-top:14px;">
            <h4>出勤记录明细（按日期倒序，可编辑修正）</h4>
            <div id="statsRecordList"></div>
        </div>
    </div>
</div>

<script src="/js/store.js"></script>
<script src="/js/calendar.js"></script>
<script src="/js/rollcall.js"></script>
<script src="/js/lessonlog.js"></script>
<script src="/js/aiChat.js"></script>
<script src="/js/stats.js"></script>
<script src="/js/roster.js"></script>
<script src="/js/lessonplan.js"></script>
<script src="/js/activity.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
